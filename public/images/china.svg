<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="cnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A0E17" />
      <stop offset="50%" stop-color="#0B2F6B" />
      <stop offset="100%" stop-color="#081A38" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#cnGrad)" />
  <circle cx="400" cy="300" r="170" fill="#E21F26" fill-opacity="0.25" filter="blur(60px)" />
  
  <g transform="translate(100, 130)" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2" fill="none">
    <!-- Modern Tech / Medical Laboratory Tower Motif -->
    <rect x="220" y="80" width="160" height="200" rx="8" />
    <line x1="220" y1="120" x2="380" y2="120" />
    <line x1="220" y1="160" x2="380" y2="160" />
    <line x1="220" y1="200" x2="380" y2="200" />
    <line x1="220" y1="240" x2="380" y2="240" />
    <line x1="300" y1="80" x2="300" y2="280" />
    <!-- Stethoscope / Medical Pulse Line -->
    <path d="M 120 200 L 190 200 L 205 160 L 220 240 L 235 180 L 250 200 L 480 200" stroke="#FFD700" stroke-width="3" stroke-linecap="round" />
  </g>

  <g transform="translate(400, 180)">
    <circle cx="0" cy="0" r="50" fill="#164B9B" fill-opacity="0.6" stroke="#FFFFFF" stroke-width="2" />
    <text x="0" y="10" fill="#FFD700" font-family="'Outfit', system-ui, sans-serif" font-size="28" font-weight="900" text-anchor="middle">★</text>
  </g>

  <text x="400" y="440" fill="#FFFFFF" font-family="'Outfit', system-ui, sans-serif" font-size="46" font-weight="900" text-anchor="middle" letter-spacing="2">CHINA</text>
  <text x="400" y="480" fill="#FFD700" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Advanced Medical Infrastructure &amp; English-Medium MBBS</text>
  <text x="400" y="515" fill="#FFFFFF" fill-opacity="0.75" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="500" text-anchor="middle">State-of-the-Art Hospital Attachments and Biomedical Facilities</text>
</svg>
