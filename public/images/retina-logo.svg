<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" fill="none">
  <!-- Retina Official Brand Mark -->
  <g id="retina-logo-group">
    <!-- Caduceus / Medical Eye Icon -->
    <g transform="translate(10, 10)">
      <circle cx="35" cy="35" r="33" fill="#0E4BA4" fill-opacity="0.08" stroke="#0E4BA4" stroke-width="2.5" />
      <!-- Stylized Medical Eye / Cross -->
      <path d="M 17 35 Q 35 15, 53 35 Q 35 55, 17 35 Z" fill="none" stroke="#0E4BA4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="35" cy="35" r="9" fill="#FF914D" />
      <circle cx="35" cy="35" r="4.5" fill="#FFFFFF" />
      <!-- Subtle Medical Cross Accent -->
      <path d="M 35 7 L 35 13 M 32 10 L 38 10" stroke="#FF914D" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Brand Typography -->
    <text x="88" y="44" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="900" fill="#102A43" letter-spacing="1.5">RETINA</text>
    <text x="90" y="62" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0E4BA4" letter-spacing="1.2">EDUCATIONAL CONSULTANCY PVT. LTD.</text>
    <text x="90" y="76" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#5B6472" letter-spacing="0.4">RUN BY DHAKA UNIVERSITY GRADUATE DOCTORS</text>
  </g>
</svg>
