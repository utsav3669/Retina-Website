<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="counselBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071936" />
      <stop offset="50%" stop-color="#0B2F6B" />
      <stop offset="100%" stop-color="#164B9B" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" rx="24" fill="url(#counselBg)" />
  <circle cx="200" cy="200" r="160" fill="#164B9B" fill-opacity="0.25" filter="blur(50px)" />
  <circle cx="650" cy="450" r="180" fill="#E21F26" fill-opacity="0.18" filter="blur(60px)" />

  <!-- Two Professional Doctor Counselors Graphic Motif -->
  <g transform="translate(400, 220)">
    <!-- Doctor Left -->
    <circle cx="-100" cy="-30" r="45" fill="#FFFFFF" fill-opacity="0.15" stroke="#FFFFFF" stroke-width="2" />
    <path d="M -160 80 C -160 20, -100 20, -100 20 C -100 20, -40 20, -40 80 Z" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-width="2" />
    
    <!-- Doctor Right -->
    <circle cx="100" cy="-30" r="45" fill="#FFFFFF" fill-opacity="0.15" stroke="#FFFFFF" stroke-width="2" />
    <path d="M 40 80 C 40 20, 100 20, 100 20 C 100 20, 160 20, 160 80 Z" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-width="2" />

    <!-- Center Consultation Caduceus Crest -->
    <circle cx="0" cy="10" r="40" fill="#0B2F6B" stroke="#E21F26" stroke-width="3" />
    <path d="M -15 10 L 15 10 M 0 -5 L 0 25" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
  </g>

  <text x="400" y="380" fill="#FFFFFF" font-family="'Outfit', system-ui, sans-serif" font-size="34" font-weight="900" text-anchor="middle">DOCTOR-LED COUNSELING</text>
  <text x="400" y="420" fill="#4ADE80" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">15+ Years Of Experienced Counselor</text>
  <text x="400" y="460" fill="#EAF3FF" fill-opacity="0.8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Company Owned by Doctors Who Studied From Bangladesh (Dhaka University)</text>
  <text x="400" y="500" fill="#FFFFFF" fill-opacity="0.6" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" text-anchor="middle">Putalisadak Office • Personalized Medical Admissions &amp; Scholarship Guidance</text>
</svg>
