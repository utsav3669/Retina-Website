<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="meceeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2F6B" />
      <stop offset="50%" stop-color="#164B9B" />
      <stop offset="100%" stop-color="#071E43" />
    </linearGradient>
    <linearGradient id="goldBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FFA500" />
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E21F26" />
      <stop offset="100%" stop-color="#B91C24" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" rx="24" fill="url(#meceeBg)" />
  <circle cx="700" cy="100" r="220" fill="#164B9B" fill-opacity="0.3" filter="blur(40px)" />
  <circle cx="100" cy="500" r="180" fill="#E21F26" fill-opacity="0.15" filter="blur(50px)" />

  <!-- Grid overlay lines -->
  <path d="M 0 100 L 800 100 M 0 200 L 800 200 M 0 300 L 800 300 M 0 400 L 800 400 M 0 500 L 800 500" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1" />
  <path d="M 200 0 L 200 600 M 400 0 L 400 600 M 600 0 L 600 600" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1" />

  <!-- Top Alert Tag -->
  <g transform="translate(50, 45)">
    <rect width="320" height="38" rx="19" fill="url(#redAccent)" />
    <text x="160" y="24" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="1.5">!!! MECEE-BL 2027 ALERT !!!</text>
  </g>

  <!-- Retina Branding Header -->
  <text x="750" y="70" fill="#FFFFFF" fill-opacity="0.8" font-family="'Outfit', system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="end" letter-spacing="1">RETINA EDUCATIONAL CONSULTANCY</text>

  <!-- Central Highlight -->
  <text x="50" y="160" fill="#FFFFFF" font-family="'Outfit', system-ui, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">CEE ONLINE</text>
  <text x="50" y="220" fill="#EAF3FF" font-family="'Outfit', system-ui, sans-serif" font-size="40" font-weight="800">form submission</text>

  <!-- Big Offer Box -->
  <g transform="translate(50, 255)">
    <rect width="700" height="150" rx="20" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5" />
    
    <text x="40" y="55" fill="#FFEB3B" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="24" font-weight="800" letter-spacing="2">WITH ZERO CHARGES</text>
    <text x="40" y="115" fill="#FFFFFF" font-family="'Outfit', system-ui, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">PAY Rs. 0 ONLY</text>

    <!-- Checkmark Badge -->
    <g transform="translate(560, 45)">
      <circle cx="40" cy="30" r="36" fill="url(#goldBadge)" />
      <path d="M 28 30 L 36 38 L 52 22" stroke="#0B2F6B" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Bottom Message -->
  <g transform="translate(50, 440)">
    <rect width="700" height="110" rx="16" fill="#0B2F6B" stroke="#164B9B" stroke-width="1.5" />
    <text x="35" y="42" fill="#EAF3FF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="700">Get free counselling session with experts</text>
    <text x="35" y="76" fill="#FFFFFF" fill-opacity="0.75" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="500">Free exam form-fillup at our office • New Plaza, Putalisadak-29, Kathmandu</text>
    <text x="665" y="62" fill="#4ADE80" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="end">01-4547423 • +880 1701-882586</text>
  </g>
</svg>
