<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="doctorBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071730" />
      <stop offset="50%" stop-color="#0B2F6B" />
      <stop offset="100%" stop-color="#164B9B" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" rx="24" fill="url(#doctorBg)" />
  <circle cx="400" cy="300" r="280" fill="#164B9B" fill-opacity="0.25" filter="blur(60px)" />
  <circle cx="700" cy="150" r="140" fill="#E21F26" fill-opacity="0.18" filter="blur(40px)" />

  <!-- Dedication Top -->
  <text x="400" y="80" fill="#E21F26" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="3">DEDICATED TO ALL CEE PREPARING STUDENTS</text>

  <!-- Stethoscope / Medical Icon Symbolism -->
  <g transform="translate(370, 110)">
    <circle cx="30" cy="30" r="28" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2" />
    <path d="M 22 30 L 38 30 M 30 22 L 30 38" stroke="#E21F26" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Big Bold Quote -->
  <text x="400" y="240" fill="#FFFFFF" fill-opacity="0.9" font-family="'Outfit', system-ui, sans-serif" font-size="44" font-weight="700" text-anchor="middle">Don't stop until</text>
  <text x="400" y="300" fill="#FFFFFF" fill-opacity="0.9" font-family="'Outfit', system-ui, sans-serif" font-size="44" font-weight="700" text-anchor="middle">they call you a</text>
  <text x="400" y="390" fill="#FFD700" font-family="'Outfit', system-ui, sans-serif" font-size="76" font-weight="900" text-anchor="middle" letter-spacing="3">DOCTOR</text>

  <!-- Hashtags & Retina Identity -->
  <g transform="translate(400, 460)">
    <rect x="-110" y="-20" width="220" height="40" rx="20" fill="#E21F26" />
    <text x="0" y="6" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="1">#RetinaCares</text>
  </g>

  <text x="400" y="530" fill="#EAF3FF" fill-opacity="0.7" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle" letter-spacing="2">#retina • #mbbs • #cee • #medicalstudent</text>
  <text x="400" y="565" fill="#FFFFFF" fill-opacity="0.5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" text-anchor="middle">Retina Educational Consultancy • Run by Doctors Graduated from Dhaka University</text>
</svg>
