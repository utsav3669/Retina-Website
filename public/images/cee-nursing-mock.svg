      <text x="90" y="55" fill="#FFD700" font-family="'Outfit', system-ui, sans-serif" font-size="34" font-weight="900" text-anchor="middle">FRIDAY</text>
      <text x="90" y="105" fill="#FFFFFF" font-family="'Outfit', system-ui, sans-serif" font-size="44" font-weight="900" text-anchor="middle">3 PM</text>
      <text x="90" y="145" fill="#EAF3FF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">३ बजे देखि</text>
