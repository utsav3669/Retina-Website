  <text x="50" y="180" fill="#FFFFFF" fill-opacity="0.9" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="600">Mock Test दिँदा दिँदै जानुहुन्छ? 😄</text>

