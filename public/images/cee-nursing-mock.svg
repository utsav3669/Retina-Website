      <stop offset="0%" stop-color="#0F2B48" />
      <stop offset="60%" stop-color="#164B9B" />
      <stop offset="100%" stop-color="#0B1E38" />
    </linearGradient>
    <linearGradient id="coralAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E21F26" />
      <stop offset="100%" stop-color="#FF5252" />
