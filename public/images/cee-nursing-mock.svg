  </defs>

  <rect width="800" height="600" rx="24" fill="url(#nursingBg)" />
  <circle cx="150" cy="120" r="180" fill="#E21F26" fill-opacity="0.15" filter="blur(60px)" />
  <circle cx="700" cy="450" r="220" fill="#164B9B" fill-opacity="0.3" filter="blur(50px)" />

  <!-- Top Badge -->
  <g transform="translate(50, 40)">
