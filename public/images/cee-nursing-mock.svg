      <text x="0" y="65" fill="#4ADE80" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="700">✓ Full Mock Test Simulation</text>
      <text x="0" y="95" fill="#4ADE80" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="700">✓ Real-time Marks Boosting Tips</text>
      <text x="0" y="125" fill="#4ADE80" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="700">✓ Personalized Feedback by Doctors</text>
    </g>
