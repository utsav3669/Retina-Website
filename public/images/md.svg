  </defs>
  <rect width="800" height="600" rx="24" fill="url(#mdBg)" />
  <circle cx="400" cy="240" r="140" fill="#164B9B" fill-opacity="0.3" filter="blur(50px)" />
  
  <g transform="translate(400, 220)">
